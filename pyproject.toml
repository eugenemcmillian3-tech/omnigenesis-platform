[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnigenesis-sdk"
version = "5.0.0"
description = "Official Python SDK & CLI for OMNIGENESIS-Ω 5th-Paradigm Hyper-Intelligence Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24.0", "scipy>=1.10.0", "cryptography>=41.0.0"]

[project.scripts]
omnigenesis = "omnigenesis_sdk.cli:main"

[tool.setuptools]
packages = ["omnigenesis_sdk"]
py-modules = ["omnigenesis_engine", "platform_security", "platform_admin"]
