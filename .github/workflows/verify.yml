name: Platform verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install native runtimes
        run: sudo apt-get update && sudo apt-get install -y gcc libc6-dev nodejs
      - name: Install verified Python dependencies
        run: python -m pip install -r requirements.lock
      - name: Run isolated platform verification
        run: python scripts/verify.py
